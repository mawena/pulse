# MawenaPulse — vhost nginx pour pulse.mawena.cloud
# Installer dans /etc/nginx/sites-available/ puis :
#   ln -s /etc/nginx/sites-available/pulse.mawena.cloud.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Certificat TLS : certbot --nginx -d pulse.mawena.cloud

server {
    listen 80;
    listen [::]:80;
    server_name pulse.mawena.cloud;

    root /var/www/pulse/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Headers de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket Reverb (temps réel) — proxy vers le serveur local
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets buildés par Vite : cache long
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Interdire l'accès aux fichiers cachés (sauf ACME pour certbot)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
